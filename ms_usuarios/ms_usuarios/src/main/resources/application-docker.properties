spring.application.name=ms-usuarios
server.port=8090

spring.datasource.url=jdbc:mysql://mysql-usuarios:3306/usuarios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
